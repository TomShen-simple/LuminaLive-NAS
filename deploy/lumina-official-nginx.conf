location /live-official/ {
    proxy_pass http://127.0.0.1:8783;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
    gzip off;
    # Subscription paths contain a private playback key.
    access_log off;
    limit_except GET HEAD { deny all; }
    add_header X-Accel-Buffering no always;
}

# Preserve existing /live-auto/CCTV URLs, but serve official Migu from the NAS
# through the guarded VPS gateway. Keep non-official channels on the legacy
# gateway; CCTV16 deliberately has no official Migu replacement.
location ~* ^/live-auto/cctv(1[0-5]|17|[1-9]|5plus)/(index\.m3u8|api/migu/asset/[A-Za-z0-9_.-]+)$ {
    proxy_pass http://127.0.0.1:8783;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
    gzip off;
    limit_except GET HEAD { deny all; }
    add_header X-Accel-Buffering no always;
}
