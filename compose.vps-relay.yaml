# 在国内 NAS 上运行：咪咕官方接口与媒体回源均发生在 NAS，VPS 仅通过反向 SSH 隧道访问。
# 使用前复制 .env.vps-relay.example 为 .env，并把专用私钥、known_hosts 放入 ./secrets。
services:
  lumina-live:
    image: ${IMAGE_NAME:-s1mpleboy/lumina-live-nas:latest}
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:${HOST_PORT:-18780}:8780"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      REFRESH_INTERVAL: "${REFRESH_INTERVAL:-1800}"
      STARTUP_DELAY: "${STARTUP_DELAY:-3}"
      HTTP_TIMEOUT: "${HTTP_TIMEOUT:-10}"
      CHANNEL_WORKERS: "${CHANNEL_WORKERS:-24}"
      MAX_CANDIDATES_PER_CHANNEL: "${MAX_CANDIDATES_PER_CHANNEL:-8}"
      MAX_BANDWIDTH: "${MAX_BANDWIDTH:-10000000}"
      EXTRA_M3U_URLS: "${EXTRA_M3U_URLS:-}"
      UPSTREAM_USER_AGENT: "${UPSTREAM_USER_AGENT:-Mozilla/5.0 (Linux; Android 14; TV) AppleWebKit/537.36 Chrome/126.0 Safari/537.36}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      MIGU_RELAY_TOKEN: "${MIGU_RELAY_TOKEN:?请在 .env 设置 MIGU_RELAY_TOKEN}"
      MIGU_RELAY_SIGNING_SECRET: "${MIGU_RELAY_SIGNING_SECRET:?请在 .env 设置 MIGU_RELAY_SIGNING_SECRET}"
    volumes:
      - ${CONFIG_DIR:-./config}:/config
      - ${DATA_DIR:-./data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # /api/info 只验证服务进程；普通 M3U 上游暂时失效时也不应阻断官方咪咕中继。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8780/api/info"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

  vps-tunnel:
    image: ${IMAGE_NAME:-s1mpleboy/lumina-live-nas:latest}
    restart: unless-stopped
    depends_on:
      lumina-live:
        condition: service_healthy
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/lumina-vps-tunnel"]
    environment:
      VPS_HOST: "${VPS_HOST:?请在 .env 设置 VPS_HOST}"
      VPS_SSH_USER: "${VPS_SSH_USER:-opc}"
      VPS_RELAY_PORT: "${VPS_RELAY_PORT:-18782}"
      VPS_TUNNEL_KEY_B64: "${VPS_TUNNEL_KEY_B64:?请在 .env 设置 VPS_TUNNEL_KEY_B64}"
      VPS_KNOWN_HOSTS_B64: "${VPS_KNOWN_HOSTS_B64:?请在 .env 设置 VPS_KNOWN_HOSTS_B64}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
